name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'

jobs:
  build-and-test: # Renamed from 'build' to represent reality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 1. Check for Syntax/Logic Errors (Linting)
      # (Optional: Only add this if you have a 'lint' script in package.json)
      # - name: Lint Code
      #   run: npm run lint

      # 2. Check for Type Errors (TypeScript)
      - name: Type Check
        run: npm run type-check

      # 3. Run the Unit Tests (Jest)
      # This runs the tests we just fixed!
      - name: Run Unit Tests
        run: npm test

      # 4. Verify Production Build
      # Ensures the app actually compiles for production
      - name: Build Application
        run: npm run build
